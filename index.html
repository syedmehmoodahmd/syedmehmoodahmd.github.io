
<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمود کا کیلکولیٹر Pro Max</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <style>
        :root {
            --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --calc-bg: #1e1e1e;
            --display-bg: #2d2d2d;
            --text: white;
            --btn-num: #4a4a4a;
        }
        [data-theme="light"] {
            --bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --calc-bg: #ffffff;
            --display-bg: #f0f0f0;
            --text: #333;
            --btn-num: #e0e0e0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: var(--bg);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; gap: 20px; flex-wrap: wrap; transition: 0.3s;
        }
        .calculator {
            background: var(--calc-bg); border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 340px; transition: 0.3s;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .title { color: var(--text); font-size: 15px; }
        .btn-group { display: flex; gap: 6px; }
        .theme-btn, .sci-btn {
            background: var(--btn-num); color: var(--text); border: none;
            border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
        }
        .memory-indicator {
            color: #ff9500; font-size: 14px; font-weight: bold; 
            min-height: 20px; text-align: left; padding-left: 10px;
        }
        .display {
            background: var(--display-bg); color: var(--text); font-size: 2.2rem; text-align: right;
            padding: 20px; border-radius: 10px; margin-bottom: 10px;
            min-height: 80px; word-wrap: break-word; transition: 0.3s;
        }
        .memory-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
        .sci-buttons { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
        .sci-buttons.active { display: grid; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button {
            border: none; border-radius: 10px; font-size: 1.2rem; padding: 16px;
            cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-number { background: var(--btn-num); color: var(--text); }
        .btn-operator { background: #ff9500; color: white; }
        .btn-clear { background: #a5a5a5; color: black; }
        .btn-sci { background: #007AFF; color: white; font-size: 1rem; }
        .btn-memory { background: #5856d6; color: white; font-size: 1rem; }
        .btn-equals { background: #ff9500; color: white; grid-column: span 2; }
        .history {
            background: var(--calc-bg); border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 340px; max-height: 500px; transition: 0.3s;
        }
        .history-title { color: var(--text); text-align: center; margin-bottom: 15px; font-size: 18px; }
        .history-list {
            background: var(--display-bg); border-radius: 10px; padding: 15px;
            max-height: 400px; overflow-y: auto; color: var(--text); transition: 0.3s;
        }
        .history-item { padding: 8px 0; border-bottom: 1px solid #444; font-size: 14px; }
        .clear-history {
            width: 100%; margin-top: 10px; background: #ff3b30; color: white;
            padding: 10px; border-radius: 8px; font-size: 1rem;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="calculator">
        <div class="top-bar">
            <div class="title">محمود کا کیلکولیٹر Pro Max 🧮</div>
            <div class="btn-group">
                <button class="sci-btn" onclick="toggleScientific()">🔬 Sci</button>
                <button class="theme-btn" onclick="toggleTheme()">☀️ Light</button>
            </div>
        </div>
        <div class="memory-indicator" id="memoryIndicator"></div>
        <div class="display" id="display">0</div>
        
        <div class="memory-buttons">
            <button class="btn-memory" onclick="memoryClear()">MC</button>
            <button class="btn-memory" onclick="memoryRecall()">MR</button>
            <button class="btn-memory" onclick="memoryAdd()">M+</button>
            <button class="btn-memory" onclick="memorySubtract()">M-</button>
        </div>

        <div class="sci-buttons" id="sciButtons">
            <button class="btn-sci" onclick="appendToDisplay('Math.sin(')">sin</button>
            <button class="btn-sci" onclick="appendToDisplay('Math.cos(')">cos</button>
            <button class="btn-sci" onclick="appendToDisplay('Math.tan(')">tan</button>
            <button class="btn-sci" onclick="appendToDisplay('Math.PI')">π</button>
            <button class="btn-sci" onclick="appendToDisplay('Math.sqrt(')">√</button>
            <button class="btn-sci" onclick="appendToDisplay('**2')">x²</button>
            <button class="btn-sci" onclick="appendToDisplay('(')">(</button>
            <button class="btn-sci" onclick="appendToDisplay(')')">)</button>
        </div>

        <div class="buttons">
            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-clear" onclick="deleteLast()">⌫</button>
            <button class="btn-operator" onclick="appendToDisplay('%')">%</button>
            <button class="btn-operator" onclick="appendToDisplay('/')">÷</button>
            <button class="btn-number" onclick="appendToDisplay('7')">7</button>
            <button class="btn-number" onclick="appendToDisplay('8')">8</button>
            <button class="btn-number" onclick="appendToDisplay('9')">9</button>
            <button class="btn-operator" onclick="appendToDisplay('*')">×</button>
            <button class="btn-number" onclick="appendToDisplay('4')">4</button>
            <button class="btn-number" onclick="appendToDisplay('5')">5</button>
            <button class="btn-number" onclick="appendToDisplay('6')">6</button>
            <button class="btn-operator" onclick="appendToDisplay('-')">-</button>
            <button class="btn-number" onclick="appendToDisplay('1')">1</button>
            <button class="btn-number" onclick="appendToDisplay('2')">2</button>
            <button class="btn-number" onclick="appendToDisplay('3')">3</button>
            <button class="btn-operator" onclick="appendToDisplay('+')">+</button>
            <button class="btn-number" onclick="appendToDisplay('0')">0</button>
            <button class="btn-number" onclick="appendToDisplay('.')">.</button>
            <button class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <div class="history">
        <div class="history-title">History 📝</div>
        <div class="history-list" id="historyList">ابھی کوئی حساب نہیں</div>
        <button class="clear-history" onclick="clearHistory()">History صاف کرو</button>
    </div>

    <script>
        let display = document.getElementById('display');
        let historyList = document.getElementById('historyList');
        let memoryIndicator = document.getElementById('memoryIndicator');
        let history = [];
        let sciMode = false;
        let memory = 0;

        function updateMemoryIndicator() {
            memoryIndicator.innerText = memory !== 0 ? 'M' : '';
        }

        function memoryAdd() {
            memory += parseFloat(display.innerText) || 0;
            updateMemoryIndicator();
        }

        function memorySubtract() {
            memory -= parseFloat(display.innerText) || 0;
            updateMemoryIndicator();
        }

        function memoryRecall() {
            display.innerText = memory;
        }

        function memoryClear() {
            memory = 0;
            updateMemoryIndicator();
        }

        function toggleTheme() {
            let body = document.body;
            let btn = document.querySelector('.theme-btn');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                btn.innerHTML = '🌙 Dark';
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerHTML = '☀️ Light';
            }
        }

        function toggleScientific() {
            sciMode = !sciMode;
            document.getElementById('sciButtons').classList.toggle('active');
            document.querySelector('.sci-btn').innerHTML = sciMode ? '🔢 Basic' : '🔬 Sci';
        }

        function appendToDisplay(value) {
            if (display.innerText === '0' || display.innerText === 'Error') {
                display.innerText = value;
            } else {
                display.innerText += value;
            }
        }

        function clearDisplay() {
            display.innerText = '0';
        }

        function deleteLast() {
            display.innerText = display.innerText.slice(0, -1);
            if (display.innerText === '') display.innerText = '0';
        }

        function calculate() {
            try {
                let expression = display.innerText.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(expression);
                let historyItem = `${display.innerText} = ${result}`;
                history.unshift(historyItem);
                updateHistory();
                display.innerText = result;
            } catch {
                display.innerText = 'Error';
            }
        }

        function updateHistory() {
            if (history.length === 0) {
                historyList.innerHTML = 'ابھی کوئی حساب نہیں';
                return;
            }
            historyList.innerHTML = history.slice(0, 10).map(item => 
                `<div class="history-item">${item}</div>`
            ).join('');
        }

        function clearHistory() {
            history = [];
            updateHistory();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }
    </script>
</body>
</html>
