
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2a5298">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 10px;
        }
        .calculator {
            background: #222; border-radius: 20px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%; max-width: 400px;
        }
        h1 { color: white; text-align: center; margin-bottom: 10px; font-size: 20px; }
        #display {
            width: 100%; height: 70px; background: #000; color: #0f0;
            text-align: right; font-size: 2em; padding: 10px;
            border: none; border-radius: 10px; margin-bottom: 10px;
        }
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        button {
            height: 50px; border: none; border-radius: 8px;
            font-size: 1em; font-weight: bold; cursor: pointer;
            background: #444; color: white;
        }
        button:active { transform: scale(0.95); }
        .operator { background: #ff9500; }
        .sci { background: #6a5acd; font-size: 0.9em; }
        .clear { background: #a5a5a5; color: black; }
        .equals { background: #ff9500; grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Scientific Calculator 🧮</h1>
        <input type="text" id="display" disabled value="0">
        <div class="buttons">
            <!-- Row 1: Scientific -->
            <button class="sci" onclick="append('Math.sin(')">sin</button>
            <button class="sci" onclick="append('Math.cos(')">cos</button>
            <button class="sci" onclick="append('Math.tan(')">tan</button>
            <button class="sci" onclick="append('Math.sqrt(')">√</button>
            <button class="sci" onclick="append('**')">x^y</button>

            <!-- Row 2: Scientific + Clear -->
            <button class="sci" onclick="append('Math.log10(')">log</button>
            <button class="sci" onclick="append('Math.log(')">ln</button>
            <button class="sci" onclick="append('Math.PI')">π</button>
            <button class="sci" onclick="append('Math.E')">e</button>
            <button class="clear" onclick="clearDisplay()">C</button>

            <!-- Row 3: Numbers -->
            <button class="sci" onclick="append('(')">(</button>
            <button class="sci" onclick="append(')')">)</button>
            <button class="sci" onclick="toggleSign()">+/-</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="append('/')">÷</button>
            
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">×</button>
            <button class="operator" onclick="append('%')">%</button>
            
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">-</button>
            <button class="sci" onclick="append('!')">n!</button>
            
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>
            <button class="sci" onclick="append('1/')">1/x</button>
            
            <button onclick="append('0')">0</button>
            <button onclick="append('00')">00</button>
            <button onclick="append('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        
        function append(value) {
            if (display.value === '0' && value !== '.') display.value = '';
            display.value += value;
        }
        
        function clearDisplay() { display.value = '0'; }
        
        function deleteLast() {
            display.value = display.value.slice(0, -1);
            if (display.value === '') display.value = '0';
        }
        
        function toggleSign() {
            if (display.value !== '0') {
                if (display.value.startsWith('-')) {
                    display.value = display.value.substring(1);
                } else {
                    display.value = '-' + display.value;
                }
            }
        }
        
        function calculate() {
            try {
                let expression = display.value.replace(/!/g, '');
                // Factorial function
                if (display.value.includes('!')) {
                    let num = parseFloat(display.value.replace('!', ''));
                    let result = 1;
                    for (let i = 2; i <= num; i++) result *= i;
                    display.value = result;
                    return;
                }
                display.value = eval(expression);
            } catch {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
