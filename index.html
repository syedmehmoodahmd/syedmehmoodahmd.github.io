<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syed Mahmood Calculator</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif;}
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
       .calculator {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2); width: 100%; max-width: 350px;
        }
       .display {
            background: rgba(0,0,0,0.3); color: white; font-size: 2.5rem; padding: 20px;
            text-align: right; border-radius: 10px; margin-bottom: 20px; min-height: 80px;
            word-wrap: break-word; word-break: break-all;
        }
       .buttons {display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;}
        button {
            padding: 20px; font-size: 1.2rem; border: none; border-radius: 10px;
            background: rgba(255,255,255,0.2); color: white; cursor: pointer; transition: 0.2s;
        }
        button:hover {background: rgba(255,255,255,0.3); transform: scale(1.05);}
        button:active {transform: scale(0.95);}
       .operator {background: rgba(255,165,0,0.6);}
       .equals {background: rgba(0,200,83,0.6); grid-column: span 2;}
       .clear {background: rgba(255,0,0,0.6);}
       .voice {background: rgba(33,150,243,0.6);}
       .voice.active {background: rgba(255,0,0,0.8); animation: pulse 1s infinite;}
        @keyframes pulse {0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;}}
       .memory {background: rgba(156,39,176,0.6);}
       .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
            border-radius: 25px; opacity: 0; transition: 0.3s; pointer-events: none;
        }
       .toast.show {opacity: 1;}
       .title {text-align: center; color: white; margin-bottom: 15px; font-size: 1.3rem; font-weight: 600;}
       .memory-indicator {text-align: center; color: #FFD700; font-size: 0.8rem; height: 15px; margin-bottom: 5px;}
    </style>
</head>
<body>
    <div class="calculator">
        <div class="title">Syed Mahmood Calculator</div>
        <div class="memory-indicator" id="memoryIndicator"></div>
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="memory" onclick="memoryClear()">MC</button>
            <button class="memory" onclick="memoryRecall()">MR</button>
            <button class="operator" onclick="appendOperator('/')">/</button>

            <button class="memory" onclick="memoryAdd()">M+</button>
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>

            <button class="memory" onclick="memorySubtract()">M-</button>
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>

            <button class="operator" onclick="appendOperator('*')">×</button>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>

            <button class="operator" onclick="appendOperator('-')">-</button>
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="voice" id="voiceBtn" onclick="toggleVoice()">🎤 Voice</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        let display = document.getElementById('display');
        let currentInput = '0';
        let shouldResetDisplay = false;
        let memory = 0;
        let recognition = null;
        let isListening = false;

        function updateDisplay() {
            display.innerText = currentInput;
        }

        function updateMemoryIndicator() {
            document.getElementById('memoryIndicator').innerText = memory!== 0? 'M' : '';
        }

        function appendNumber(num) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = num;
                shouldResetDisplay = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (shouldResetDisplay) shouldResetDisplay = false;
            currentInput += op;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            try {
                let result = eval(currentInput.replace(/×/g, '*'));
                currentInput = String(result);
                shouldResetDisplay = true;
                updateDisplay();
            } catch (e) {
                currentInput = 'Error';
                shouldResetDisplay = true;
                updateDisplay();
                setTimeout(clearDisplay, 1500);
            }
        }

        function memoryClear() {
            memory = 0;
            updateMemoryIndicator();
            showToast('Memory Cleared');
        }

        function memoryRecall() {
            currentInput = String(memory);
            shouldResetDisplay = true;
            updateDisplay();
        }

        function memoryAdd() {
            try {
                memory += parseFloat(eval(currentInput)) || 0;
                updateMemoryIndicator();
                showToast('Added to Memory');
                shouldResetDisplay = true;
            } catch (e) {
                showToast('Error');
            }
        }

        function memorySubtract() {
            try {
                memory -= parseFloat(eval(currentInput)) || 0;
                updateMemoryIndicator();
                showToast('Subtracted from Memory');
                shouldResetDisplay = true;
            } catch (e) {
                showToast('Error');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window)) {
                showToast('Voice صرف Chrome میں چلے گا');
                return;
            }
            if (!recognition) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                recognition.onstart = () => {
                    isListening = true;
                    document.getElementById('voiceBtn').classList.add('active');
                    showToast('بولو... Speak...');
                };
                recognition.onresult = (e) => {
                    let text = e.results[0][0].transcript.toLowerCase();
                    text = text.replace(/جمع|plus|add/gi, '+')
                          .replace(/منفی|minus|subtract/gi, '-')
                          .replace(/ضرب|times|multiply|into/gi, '*')
                          .replace(/تقسیم|divided by|divide/gi, '/')
                          .replace(/پانچ|five/gi, '5')
                          .replace(/تین|three/gi, '3')
                          .replace(/دو|two/gi, '2')
                          .replace(/ایک|one/gi, '1')
                          .replace(/چار|four/gi, '4')
                          .replace(/چھ|six/gi, '6')
                          .replace(/سات|seven/gi, '7')
                          .replace(/آٹھ|eight/gi, '8')
                          .replace(/نو|nine/gi, '9')
                          .replace(/صفر|zero/gi, '0');
                    currentInput = text;
                    updateDisplay();
                    calculate();
                    showToast('سمجھ گیا: ' + text);
                };
                recognition.onerror = (e) => {
                    if(e.error === 'not-allowed') {
                        showToast('Mic Permission دو Chrome Settings سے');
                    } else {
                        showToast('Error: ' + e.error);
                    }
                    isListening = false;
                    document.getElementById('voiceBtn').classList.remove('active');
                };
                recognition.onend = () => {
                    isListening = false;
                    document.getElementById('voiceBtn').classList.remove('active');
                };
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.lang = 'ur-PK';
                try {
                    recognition.start();
                } catch(err) {
                    recognition.lang = 'en-US';
                    recognition.start();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendOperator(e.key);
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearDisplay();
        });

        updateDisplay();
        updateMemoryIndicator();
    </script>
</body>
</html>
